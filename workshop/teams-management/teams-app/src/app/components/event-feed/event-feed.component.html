<!-- event feed: last 5 events for a team -->
<div class="event-feed" *ngIf="events.length > 0">
  <h4 class="event-feed-title">Recent Events</h4>
  <ul class="event-list">
    <li
      class="event-item"
      *ngFor="let event of events"
      [class.severity-info]="event.severity === 'info'"
      [class.severity-warning]="event.severity === 'warning'"
      [class.severity-error]="event.severity === 'error'"
    >
      <span class="event-icon" [title]="event.severity">{{ eventIcon(event.severity) }}</span>
      <div class="event-body">
        <span class="event-message">{{ displayMessage(event) }}</span>
        <span class="event-meta">{{ formatTime(event.timestamp) }} · {{ event.namespace }} · {{ displaySource(event) }}</span>
      </div>
      <div class="event-links" *ngIf="event.links.length > 0">
        <a
          *ngFor="let link of event.links"
          [href]="link.url"
          target="_blank"
          rel="noopener"
          class="event-link-chip"
        >{{ link.label }}</a>
      </div>
    </li>
  </ul>
</div>
<div class="event-feed event-feed-empty" *ngIf="events.length === 0">
  <span class="event-feed-empty-text">No events yet</span>
</div>
