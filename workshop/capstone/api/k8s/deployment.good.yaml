apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: emoji-api
  namespace: ${NAMESPACE}
  labels:
    app: emoji-api
    color: ${COLOR}
  annotations:
    commit-sha: ${COMMIT_SHA}
spec:
  replicas: 1
  strategy:
    canary:
      steps:
      - setWeight: 50
      - pause: {}      # pauses for manual promotion; remove for auto-advance
      - setWeight: 100
  selector:
    matchLabels:
      app: emoji-api
  template:
    metadata:
      labels:
        app: emoji-api
        color: ${COLOR}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: emoji-api
        image: ${IMAGE}
        imagePullPolicy: Never
        env:
        - name: EMOJI_COLOR
          value: "${COLOR}"
        ports:
        - containerPort: 8080
          name: http
        securityContext:
          runAsNonRoot: true
          runAsUser: 1654
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: emoji-api
  namespace: ${NAMESPACE}
spec:
  selector:
    app: emoji-api
  ports:
  - port: 80
    targetPort: 8080
    name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emoji-api
  namespace: ${NAMESPACE}
spec:
  ingressClassName: nginx
  rules:
  - host: ${NAMESPACE}.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: emoji-api
            port:
              name: http
