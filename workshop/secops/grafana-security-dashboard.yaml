apiVersion: v1
kind: ConfigMap
metadata:
  name: security-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  security-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "Falco Runtime Alerts",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 10 },
                  { "color": "red", "value": 50 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "id": 2,
          "options": { "colorMode": "background", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "auto" },
          "targets": [
            {
              "expr": "sum(increase(falcosecurity_falcosidekick_falco_events_total[1h]))",
              "legendFormat": "Total Alerts"
            }
          ],
          "title": "Alerts (1h)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "id": 3,
          "options": { "colorMode": "background", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "auto" },
          "targets": [
            {
              "expr": "sum(increase(falcosecurity_falcosidekick_falco_events_total{priority_raw=\"critical\"}[1h]))",
              "legendFormat": "Critical"
            }
          ],
          "title": "Critical Alerts (1h)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "id": 4,
          "options": { "colorMode": "background", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "auto" },
          "targets": [
            {
              "expr": "sum(increase(falcosecurity_falcosidekick_falco_events_total{priority_raw=\"warning\"}[1h]))",
              "legendFormat": "Warning"
            }
          ],
          "title": "Warning Alerts (1h)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "id": 5,
          "options": { "colorMode": "background", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "auto" },
          "targets": [
            {
              "expr": "sum(increase(gatekeeper_validation_request_count{admission_status=\"deny\"}[1h]))",
              "legendFormat": "Denied Requests"
            }
          ],
          "title": "Gatekeeper Denials (1h)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 1 },
          "id": 6,
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "auto" },
          "targets": [
            {
              "expr": "sum(gatekeeper_validation_request_count{admission_status=\"deny\"})",
              "legendFormat": "Total Denials"
            }
          ],
          "title": "Gatekeeper Total Denials",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 2 }, "unit": "short" }
          },
          "gridPos": { "h": 8, "w": 14, "x": 0, "y": 5 },
          "id": 7,
          "options": { "legend": { "calcs": ["sum"], "displayMode": "table", "placement": "right" }, "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "expr": "sum by(rule) (rate(falcosecurity_falcosidekick_falco_events_total[5m]))",
              "legendFormat": "{{rule}}"
            }
          ],
          "title": "Alert Rate by Rule (5m)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "unit": "short" }
          },
          "gridPos": { "h": 8, "w": 10, "x": 14, "y": 5 },
          "id": 8,
          "options": {
            "displayLabels": ["name"],
            "legend": { "displayMode": "table", "placement": "right", "values": ["value"] },
            "pieType": "pie",
            "tooltip": { "mode": "single" }
          },
          "targets": [
            {
              "expr": "sum by(priority_raw) (increase(falcosecurity_falcosidekick_falco_events_total[1h]))",
              "legendFormat": "{{priority_raw}}"
            }
          ],
          "title": "Alerts by Priority (1h)",
          "type": "piechart"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 1, "fillOpacity": 80, "stacking": { "mode": "normal", "group": "A" } },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 13 },
          "id": 9,
          "options": {
            "legend": { "calcs": ["sum"], "displayMode": "table", "placement": "right" },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "expr": "topk(10, sum by(rule) (rate(falcosecurity_falcosidekick_falco_events_total[5m])))",
              "legendFormat": "{{rule}}"
            }
          ],
          "title": "Top 10 Rules Fired (rate)",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 21 },
          "id": 10,
          "title": "Gatekeeper Policy Enforcement",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "bars", "barAlignment": 0, "fillOpacity": 80, "lineWidth": 1, "stacking": { "mode": "normal", "group": "A" } },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 22 },
          "id": 14,
          "options": { "legend": { "calcs": ["sum"], "displayMode": "table", "placement": "right" }, "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "expr": "sum by(constraint) (increase(teams_api_gatekeeper_admission_denials_total[5m]))",
              "legendFormat": "{{constraint}}",
              "interval": "5m"
            }
          ],
          "title": "Admission Denials per 5m Bucket, by Rule",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "bars", "barAlignment": 0, "fillOpacity": 80, "lineWidth": 1, "stacking": { "mode": "normal", "group": "A" } },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 22 },
          "id": 18,
          "options": { "legend": { "calcs": ["sum"], "displayMode": "table", "placement": "right" }, "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "expr": "sum by(exported_namespace) (increase(teams_api_gatekeeper_admission_denials_total[5m]))",
              "legendFormat": "{{exported_namespace}}",
              "interval": "5m"
            }
          ],
          "title": "Admission Denials per 5m Bucket, by Team",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "short" },
            "overrides": [
              { "matcher": { "id": "byName", "options": "Constraint" }, "properties": [{ "id": "custom.width", "value": 260 }] },
              { "matcher": { "id": "byName", "options": "Kind" }, "properties": [{ "id": "custom.width", "value": 180 }] },
              { "matcher": { "id": "byName", "options": "Namespace" }, "properties": [{ "id": "custom.width", "value": 160 }] },
              { "matcher": { "id": "byName", "options": "Count" }, "properties": [{ "id": "color", "value": { "mode": "thresholds" } }, { "id": "thresholds", "value": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 1 }] } }] }
            ]
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 30 },
          "id": 16,
          "options": { "footer": { "show": false }, "showHeader": true, "sortBy": [{ "desc": true, "displayName": "Count" }] },
          "targets": [
            {
              "expr": "sort_desc(sum by(constraint, kind, exported_namespace) (teams_api_gatekeeper_active_violations))",
              "format": "table",
              "instant": true,
              "legendFormat": ""
            }
          ],
          "title": "Currently Active Violations by Rule",
          "transformations": [
            { "id": "organize", "options": { "renameByName": { "constraint": "Constraint", "kind": "Kind", "exported_namespace": "Namespace", "Value": "Count" } } }
          ],
          "type": "table"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "tags": ["security", "falco", "gatekeeper"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Security Overview",
      "uid": "security-overview",
      "version": 1
    }
