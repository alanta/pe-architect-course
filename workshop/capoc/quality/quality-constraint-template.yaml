apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: codecoveragesimple
spec:
  crd:
    spec:
      names:
        kind: CodeCoverageSimple
      validation:
        openAPIV3Schema:
          type: object
          properties:
            minimumCoverage:
              type: number
              default: 80
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package codecoverage

        # Read coverage data from the synced ConfigMap in gatekeeper-system
        coverage_data := data.inventory.namespace["gatekeeper-system"]["v1"]["ConfigMap"]["code-coverage-data"].data

        # Matches both Deployment and Argo Rollout
        target_kinds := {"Deployment", "Rollout"}

        violation[{"msg": msg}] {
          target_kinds[input.review.object.kind]
          sha := input.review.object.metadata.annotations["commit-sha"]

          # Get coverage from the ConfigMap (values are strings, convert to number)
          coverage_str := coverage_data[sha]
          coverage := to_number(coverage_str)
          minimum := input.parameters.minimumCoverage

          coverage < minimum
          msg := sprintf("Code coverage %v%% is below required minimum of %v%% for commit %v", [coverage, minimum, sha])
        }

        violation[{"msg": msg}] {
          target_kinds[input.review.object.kind]
          not input.review.object.metadata.annotations["commit-sha"]
          msg := "Missing required annotation: commit-sha"
        }

        violation[{"msg": msg}] {
          target_kinds[input.review.object.kind]
          sha := input.review.object.metadata.annotations["commit-sha"]
          not coverage_data[sha]
          msg := sprintf("No coverage data found for commit %v — run build.sh to publish coverage results", [sha])
        }
