apiVersion: constraints.gatekeeper.sh/v1beta1
kind: CodeCoverageSimple
metadata:
  name: enforce-code-coverage-simple
spec:
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
      - apiGroups: ["argoproj.io"]
        kinds: ["Rollout"]
    excludedNamespaces:
      - "kube-system"
      - "kube-public"
      - "kube-node-lease"
      - "gatekeeper-system"
      - "engineering-platform"
      - "teams-api"
      - "keycloak"
  parameters:
    minimumCoverage: 80
